services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_god
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 全环境统一使用 PostgreSQL。容器内指向 db 服务；生产见 deploy/docker-compose.prod.yml。
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/finance_god
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/finance_god
      FINANCE_GOD_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/finance_god
      FINANCE_GOD_MARKET_BAR_CACHE_PATH: /app/data/market-bars.sqlite3
      FINANCE_GOD_PANDA_AUTH_STATE_DIR: /app/data/panda-auth
      APP_ENV: ${APP_ENV:-development}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@finance-god.local}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - learning_data:/app/artifacts/knowledge:ro
      - market_data:/app/data
    command: >
      sh -c "alembic upgrade head &&
      python -m app.startup"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  learning:
    build: ./backend
    init: true
    env_file:
      - .env
    environment:
      FINANCE_GOD_KNOWLEDGE_DIR: /app/artifacts/knowledge
      FINANCE_GOD_LEARNING_INTERVAL_SECONDS: ${FINANCE_GOD_LEARNING_INTERVAL_SECONDS:-900}
      FINANCE_GOD_LEARNING_SYMBOLS: ${FINANCE_GOD_LEARNING_SYMBOLS:-000300.SH}
      FINANCE_GOD_LEARNING_TRANSACTION_COST_BPS: ${FINANCE_GOD_LEARNING_TRANSACTION_COST_BPS:-10}
    volumes:
      - ./backend:/app
      - learning_data:/app/artifacts/knowledge
    command: python -m scripts.run_self_iteration_loop
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "scripts.run_self_iteration_loop",
          "--healthcheck",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m

  frontend:
    build: ./frontend
    environment:
      # 前端容器只接收构建/代理所需变量，绝不通过 env_file 注入整份根 .env——
      # PandaData 与 AI 密钥仅属于后端容器。
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_WORKBENCH_ORIGIN: ${VITE_WORKBENCH_ORIGIN:-}
      WORKBENCH_ORIGIN: ${WORKBENCH_ORIGIN:-}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0 --port 3000
    depends_on:
      - backend

volumes:
  pgdata:
  learning_data:
  market_data:
