name: finance-god

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_god
      POSTGRES_USER: finance_god
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_god -d finance_god"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ${FINANCE_GOD_ENV_FILE:-.env.production}
    environment:
      # 生产环境固定为 production：即使 env 文件遗漏 APP_ENV，也不会回落到
      # development 而绕过 Settings 对默认 SECRET_KEY 的启动校验。
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://finance_god:${POSTGRES_PASSWORD}@db:5432/finance_god
      DATABASE_URL_SYNC: postgresql+psycopg2://finance_god:${POSTGRES_PASSWORD}@db:5432/finance_god
      FINANCE_GOD_DATABASE_URL: postgresql+psycopg2://finance_god:${POSTGRES_PASSWORD}@db:5432/finance_god
      PANDA_DATA_USERNAME: ${PANDA_DATA_USERNAME:?PANDA_DATA_USERNAME is required}
      PANDA_DATA_PASSWORD: ${PANDA_DATA_PASSWORD:?PANDA_DATA_PASSWORD is required}
      FINANCE_GOD_KNOWLEDGE_DIR: /app/artifacts/knowledge
    volumes:
      - learning_data:/app/artifacts/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  learning:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    env_file:
      - ${FINANCE_GOD_ENV_FILE:-.env.production}
    environment:
      PANDA_DATA_USERNAME: ${PANDA_DATA_USERNAME:?PANDA_DATA_USERNAME is required}
      PANDA_DATA_PASSWORD: ${PANDA_DATA_PASSWORD:?PANDA_DATA_PASSWORD is required}
      FINANCE_GOD_KNOWLEDGE_DIR: /app/artifacts/knowledge
      FINANCE_GOD_LEARNING_INTERVAL_SECONDS: ${FINANCE_GOD_LEARNING_INTERVAL_SECONDS:-900}
      FINANCE_GOD_LEARNING_SYMBOLS: ${FINANCE_GOD_LEARNING_SYMBOLS:-000300.SH}
      FINANCE_GOD_LEARNING_TRANSACTION_COST_BPS: ${FINANCE_GOD_LEARNING_TRANSACTION_COST_BPS:-10}
    volumes:
      - learning_data:/app/artifacts/knowledge
    command: python -m scripts.run_self_iteration_loop
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "scripts.run_self_iteration_loop",
          "--healthcheck",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_WORKBENCH_ORIGIN: ${VITE_WORKBENCH_ORIGIN:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  learning_data:
