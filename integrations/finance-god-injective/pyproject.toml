[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-god-injective-bridge"
version = "0.1.0"
description = "Isolated Injective Testnet execution bridge for Finance-God"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "fastapi==0.115.8",
    "httpx==0.28.1",
    "injective-py==1.13.1",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.38",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.21.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "ruff==0.9.7",
]

[project.scripts]
finance-god-injective = "bridge.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
