name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: finance-god-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production deployment boundary
        run: |
          bash -n deploy/check-production-config.sh
          bash -n deploy/remote-deploy.sh
          bash deploy/tests/test-production-config.sh
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt && pip install -e ".[dev]"

      - name: Test backend
        working-directory: backend
        env:
          PANDA_DATA_USERNAME: ci-contract-test
          PANDA_DATA_PASSWORD: ci-contract-test
        run: timeout 60s pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts

      - name: Sync release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo mkdir -p /opt/finance-god && sudo chown '$DEPLOY_USER:$DEPLOY_USER' /opt/finance-god"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.claude/' \
            --exclude='.codex/' \
            --exclude='.deploy/private/' \
            --exclude='backend/.venv/' \
            --exclude='backend/user*.json' \
            --exclude='frontend/node_modules/' \
            --exclude='frontend/dist/' \
            --exclude='deploy/.env.production' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/finance-god/"

      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x /opt/finance-god/deploy/remote-deploy.sh && /opt/finance-god/deploy/remote-deploy.sh"

      - name: Verify public API
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          readonly BASE_URL="http://$DEPLOY_HOST"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$BASE_URL/" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$BASE_URL/api/live" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$BASE_URL/api/ready" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            "$BASE_URL/api/market/overview?symbols=000001.SH,000001.SZ" >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            "$BASE_URL/api/market/bars?symbol=000001.SZ&frequency=1m" >/dev/null
